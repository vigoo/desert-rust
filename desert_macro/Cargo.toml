[package]
name = "desert_macro"
version = "0.1.13"
edition = "2021"
license = "Apache-2.0"
description = "Binary serialization library for Rust (macros)"
homepage = "https://desert-rust.vigoo.dev"
repository = "https://github.com/vigoo/desert-rust"
readme = "../README.md"

[lib]
proc-macro = true

[dependencies]
bytes = "1.12.1"
lazy_static = "1.5.1"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.10", features = ["full"] }

[dev-dependencies]
arbitrary = { version = "1.5.0", features = ["derive"] }
assert2 = "0.4.1"
lazy_static = "1.5.1"
proptest = "1.12.0"
test-r = { workspace = true }
uuid = { version = "1.29.2", features = ["v4"] }
