[package]
name = "desert_core"
version = "0.2.2"
edition = "2021"
license = "Apache-2.0"
description = "Binary serialization library for Rust (core crate)"
homepage = "https://desert-rust.vigoo.dev"
repository = "https://github.com/vigoo/desert-rust"
readme = "../README.md"

[lib]
harness = false

[dependencies]
bytes = { version = "1.12.1" }
castaway = { version = "0.2.4", features = ["std"] }
flate2 = "1.1.11"
hashbrown = "0.17.1"
lazy_static = "1.5.1"
once_cell = "1.21.4"

bigdecimal = { version = "0.4.11", optional = true }
bit-vec = { version = "0.10.2", optional = true }
chrono = { version = "0.4.45", optional = true }
chrono-tz = { version = "0.10.4", optional = true }
im = { version = "15.1", optional = true }
mac_address = { version = "1.2.1", optional = true }
nonempty-collections = { version = "1.4.0", optional = true }
url = { version = "2.5.8", optional = true }
uuid = { version = "1.29.2", optional = true }
serde_json = { version = "1.0.154", optional = true }


[dev-dependencies]
arbitrary = "1.5.0"
chrono = { version = "0.4.45", features = ["arbitrary"] }
chrono-tz = { version = "0.10.4", features = ["arbitrary"] }
proptest = "1.12.0"
test-r = { workspace = true }
uuid = { version = "1.29.2", features = ["arbitrary"] }

[features]
default = ["bigdecimal", "chrono", "uuid", "nonempty-collections", "serde-json"]
bigdecimal = ["dep:bigdecimal"]
bit-vec = ["dep:bit-vec"]
chrono = ["dep:chrono", "dep:chrono-tz"]
im = ["dep:im"]
mac_address = ["dep:mac_address"]
nonempty-collections = ["dep:nonempty-collections"]
serde-json = ["dep:serde_json"]
url = ["dep:url"]
uuid = ["dep:uuid"]
