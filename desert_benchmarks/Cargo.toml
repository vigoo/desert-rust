[package]
name = "desert_benchmarks"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
readme = "README.md"

[dependencies]
desert_rust = { path = "../desert", features = [
    "bigdecimal",
    "bit-vec",
    "chrono",
    "mac_address",
    "nonempty-collections",
    "serde-json",
    "url",
    "uuid",
] }

# 3.0.0 is a tombstone containing only compile_error!, not a usable release.
bincode = { version = "2.0.1", features = ["serde"] }
bigdecimal = "0.4.11"
bitcode = { version = "0.6.9", features = ["serde"] }
bit-vec = "0.10.2"
bytes = "1.12.1"
chrono = "0.4.45"
dlhn = "0.1.7"
iso8601-timestamp = "0.4.0"
lazy_static = "1.5.1"
mac_address = "1.2.1"
nonempty-collections = "1.4.0"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.3"
rmp = "0.8.15"
rmp-serde = "1.3.1"
serde = "1.0.229"
serde_bare = { version = "0.5.0", features = ["std"] }
serde_json = "1.0.154"
url = "2.5.8"
uuid = { version = "1.29.2", features = ["serde", "v4"] }

[dev-dependencies]
criterion = "0.8.2"

[lib]
path = "src/lib.rs"

[[bin]]
name = "desert_benchmarks_oplog_main"
path = "src/main.rs"

[[bench]]
name = "legacy_oplog"
path = "benches/oplog.rs"
harness = false

[[bench]]
name = "golden"
harness = false

[[bench]]
name = "deser"
harness = false

[[bench]]
name = "ser"
harness = false

[[bench]]
name = "golem_schema"
harness = false

[[bench]]
name = "features"
harness = false

[[bench]]
name = "golem_oplog"
harness = false

[[bench]]
name = "evolution_stress"
harness = false
