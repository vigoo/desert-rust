[package]
name = "desert_book"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[[bin]]
name = "mdbook-desert"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bigdecimal = "0.4.11"
bit-vec = "0.10.2"
bytes = "1.12.1"
chrono = "0.4.45"
desert_rust = { path = "../desert", features = [
    "bigdecimal",
    "bit-vec",
    "chrono",
    "mac_address",
    "nonempty-collections",
    "serde-json",
    "url",
    "uuid",
] }
flate2 = "1.1.11"
mac_address = "1.2.1"
nonempty-collections = "1.4.0"
serde_json = "1.0.154"
url = "2.5.8"
uuid = "1.29.2"
